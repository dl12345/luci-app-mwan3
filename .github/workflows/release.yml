permissions:
  contents: write
name: Build OpenWrt Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        required: false
        default: false
        description: "Release"

jobs:
  build:
    name: Build ${{ matrix.format }} for ${{ matrix.version }}
    runs-on: ubuntu-latest
    env:
      REPO_APK_KEY: ${{ secrets.REPO_APK_KEY }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 24.10.2
            format: ipk
            arch: x86_64-24.10.2
            luci_ref: openwrt-24.10
          - version: openwrt-25.12
            format: apk
            arch: x86_64-openwrt-25.12
            luci_ref: openwrt-25.12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set PKG_NAME from repo
        run: echo "PKG_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Set up lucimwan3nft feed structure
        run: |
          mkdir -p feed/applications/${PKG_NAME}
          rsync -av \
            --exclude='.git' \
            --exclude='feed' \
            --exclude='.github' \
            ./ feed/applications/${PKG_NAME}/
          curl -fsSL "https://raw.githubusercontent.com/openwrt/luci/${{ matrix.luci_ref }}/luci.mk" \
            -o feed/luci.mk

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v8
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: lucimwan3nft
          PACKAGES: ${{ env.PKG_NAME }}
          INDEX: 0
          FEED_DIR: ${{ github.workspace }}/feed
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1
          PRIVATE_KEY: ${{ secrets.REPO_APK_KEY }}

      - name: Extract PKG_VERSION from Makefile
        run: |
          PKG_SRC_PREFIX="$(date +%y).999"
          PKG_SRC_SUFFIX="$(grep '^PKG_SRC_SUFFIX' Makefile | sed 's/PKG_SRC_SUFFIX:=//')"
          echo "PKG_VERSION=${PKG_SRC_PREFIX}.${PKG_SRC_SUFFIX}" >> "$GITHUB_ENV"

      - name: Rename packages with version
        run: |
          set -euo pipefail
          for ext in ipk apk; do
            for f in $(find bin/packages -type f -path "*/lucimwan3nft/${PKG_NAME}[_-][0-9]*.${ext}"); do
              dir=$(dirname "$f")
              mv -v "$f" "$dir/${PKG_NAME}_${PKG_VERSION}.${ext}"
            done
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.format }}-${{ matrix.version }}
          path: |
            bin/packages/*/lucimwan3nft/${{ env.PKG_NAME }}*.ipk
            bin/packages/*/lucimwan3nft/${{ env.PKG_NAME }}*.apk
          if-no-files-found: ignore

  release:
    # if: startsWith(github.ref, 'refs/tags/v')
    name: Release ${{ github.repository }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Build v${{ steps.version.outputs.version }}
          files: |
            ./release-assets/**/*.ipk
            ./release-assets/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
